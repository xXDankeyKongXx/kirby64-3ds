name: Build Kirby 64 3DS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PICAGL_COMMIT: a10b1ce1ec2cd38a2ee3adf1033d9c789d103a31  # "revamp" branch (has pglInitEx)
      IMGUI_COMMIT: b77470554867235f5a23a16a12388667096b4ecb
      MAKEROM_TAG: makerom-v0.19.0
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake make git curl unzip bzip2 ca-certificates file

      - name: Install 3DS portlibs (zlib, libpng)
        run: |
          bash tools/ci-run.sh '
          ls $DEVKITPRO/portlibs/3ds/lib/libz.a $DEVKITPRO/portlibs/3ds/lib/libpng*.a || dkp-pacman -Sy --noconfirm --needed 3ds-zlib 3ds-libpng
          '

      - name: Build and install picaGL
        run: |
          bash tools/ci-run.sh '
          git clone -b revamp https://github.com/masterfeizz/picaGL /tmp/picaGL
          git -C /tmp/picaGL checkout -q "$PICAGL_COMMIT"
          sed -i "s/-DARM11 -D_3DS/-D__3DS__/" /tmp/picaGL/Makefile
          make -C /tmp/picaGL install
          '

      - name: Build and install imgui (picaGL backend)
        run: |
          bash tools/ci-run.sh '
          git clone https://github.com/masterfeizz/imgui-picaGL /tmp/imgui
          git -C /tmp/imgui checkout -q "$IMGUI_COMMIT"
          make -C /tmp/imgui install
          '

      - name: Fetch makerom and bannertool
        run: |
          bash tools/ci-run.sh "bash tools/ci-fetch-tools.sh"
          echo "/tmp/bin" >> "$GITHUB_PATH"

      - name: Build emulator core
        run: |
          bash tools/ci-run.sh '
          mkdir -p daedbuild && cd daedbuild
          cmake -DCTR_RELEASE=1 ../Source -DCMAKE_TOOLCHAIN_FILE=../Tools/3dstoolchain.cmake -G "Unix Makefiles"
          make -j"$(nproc)"
          '

      - name: Package 3DSX and CIA
        run: |
          bash tools/ci-run.sh '
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          bash tools/package.sh daedbuild/DaedalusX64.elf dist
          cp docs/INSTALL.txt dist/
          '

      - uses: actions/upload-artifact@v4
        with:
          name: Kirby64-3DS
          path: dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Kirby64.cia
            dist/Kirby64.3dsx
            dist/INSTALL.txt
