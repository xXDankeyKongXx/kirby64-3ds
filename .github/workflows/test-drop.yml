name: Test drop (emulator + latest build)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drop:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect files
        run: bash tools/ci-run.sh "bash tools/ci-test-drop.sh"
      - name: Push to test-drop branch
        run: |
          set -e
          cd drop
          git init -q -b test-drop
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Temporary test drop (delete after use)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" test-drop
