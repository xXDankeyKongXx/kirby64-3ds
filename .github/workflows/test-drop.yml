name: Test drop (emulator + latest build)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drop:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect files
        run: |
          set -e
          mkdir -p drop
          gh api repos/azahar-emu/azahar/releases/latest --jq '.tag_name, (.assets[].name)' | tee drop/azahar-assets.txt
          name=$(grep -iE 'linux' drop/azahar-assets.txt | grep -iE '\.AppImage$' | grep -viE 'room|aarch64|arm64' | head -1)
          echo "Using $name"
          gh release download -R azahar-emu/azahar -p "$name" -D drop
          gh release download -R ${{ github.repository }} -p 'Kirby64.*' -D drop
          ls -la drop
          echo "::notice title=Drop::$(ls drop | tr '\n' ' ')"
      - name: Push to test-drop branch
        run: |
          set -e
          cd drop
          git init -q -b test-drop
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Temporary test drop (delete after use)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" test-drop
